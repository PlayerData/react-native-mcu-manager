name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: true

      - name: Build
        working-directory: ./react-native-mcu-manager
        run: pnpm build

  android-example:
      name: Android example app (Expo SDK ${{ matrix.expo-sdk }})
      runs-on: ubuntu-latest
      needs: build
      strategy:
        matrix:
          include:
            - expo-sdk: '57'
              expo-version: '57.0.4'
            - expo-sdk: '58'
              expo-version: '58.0.23'
      steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: true

      - name: Install Expo ${{ matrix.expo-version }} in the example app
        uses: ./.github/actions/install-expo
        with:
          expo-version: ${{ matrix.expo-version }}

      - name: Making sure the android example app builds
        run: |
          cd example
          npx expo prebuild --platform android

          cd android

          # Pre-fetch the Gradle distribution with retries so a transient
          # services.gradle.org outage (e.g. HTTP 504) doesn't fail the build.
          # Only the network bootstrap is retried; the build itself runs once,
          # so genuine build failures are never masked.
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "Gradle wrapper download failed after 3 attempts"
              exit 1
            else
              echo "Gradle bootstrap attempt $attempt failed; retrying in 15s"
              sleep 15
            fi
          done

          ./gradlew app:assembleRelease --no-daemon -Dorg.gradle.logging.level=warn

  ios-example:
      name: iOS example app (Expo SDK ${{ matrix.expo-sdk }})
      runs-on: macos-26
      needs: build
      strategy:
        matrix:
          include:
            - expo-sdk: '57'
              expo-version: '57.0.4'
            - expo-sdk: '58'
              expo-version: '58.0.23'
      steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Expo ${{ matrix.expo-version }} in the example app
        uses: ./.github/actions/install-expo
        with:
          expo-version: ${{ matrix.expo-version }}

      - name: Generate the iOS project
        working-directory: ./example
        run: npx expo prebuild --platform ios

      - name: Check the callback API matches the Expo SDK
        working-directory: ./example/ios
        run: |
          grep -E '^  - ExpoModulesCore \(${{ matrix.expo-sdk }}\.' Podfile.lock

          expect_closure_args=$([ "${{ matrix.expo-sdk }}" -ge 58 ] && echo yes || echo no)
          has_closure_args=$(grep -q MCU_MANAGER_JS_CLOSURE_ARGS "Pods/Target Support Files/ReactNativeMcuManager/"*.xcconfig && echo yes || echo no)
          if [ "$expect_closure_args" != "$has_closure_args" ]; then
            echo "MCU_MANAGER_JS_CLOSURE_ARGS set: $has_closure_args, expected: $expect_closure_args"
            exit 1
          fi

      - name: Making sure the ios example app builds
        working-directory: ./example/ios
        run: xcodebuild build -workspace reactnativemcumanagerexample.xcworkspace -scheme reactnativemcumanagerexample CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  release:
    name: Release
    needs: [android-example, ios-example]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Setup PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11.28.6
        run_install: true

    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: react-native-mcu-manager
      run: npx semantic-release
